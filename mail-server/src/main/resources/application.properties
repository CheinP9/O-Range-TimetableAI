server.port=8080
internal.api.key=SieuCapVipPro_2026

# Cấu hình gửi mail qua Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Đọc từ biến môi trường, nếu không có thì dùng giá trị mặc định hoặc từ application-local.properties
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password_here}

# Cấu hình TLS / SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging chi tiết
logging.level.com.orange.mail=INFO
logging.level.org.springframework.mail=DEBUG

# Tự động nạp cấu hình cá nhân nếu có (được bảo vệ bởi .gitignore, ghi đè giá trị mặc định ở trên)
spring.config.import=optional:classpath:application-local.properties
